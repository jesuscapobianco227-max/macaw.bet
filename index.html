<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>macaw.bet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
margin:0;
background:#0b3d91;
color:white;
}

header{
background:#082a63;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:#114fb3;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

input,select{
padding:8px;
border:none;
border-radius:6px;
margin:5px;
}

button{
padding:8px 16px;
background:#ffd700;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.game{
background:#1565d8;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.hidden{
display:none;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:6px;
background:#1e6be0;
text-align:center;
}

.players img{
width:70px;
border-radius:50%;
margin:6px;
border:3px solid white;
}

</style>
</head>

<body>

<header>🦜 macaw.bet</header>

<div class="container">

<div id="login" class="card">

<h2>Login</h2>

<select id="tipoLogin">
<option value="aluno">Aluno</option>
<option value="professor">Professor</option>
</select><br>

<input id="nome" placeholder="Nome do aluno"><br>
<input id="turma" placeholder="Turma"><br>
<input id="email" placeholder="Email institucional"><br>

<button onclick="login()">Entrar</button>

<p id="erro"></p>

</div>

<div id="alunoPanel" class="hidden">

<div class="card">

<h2>Palpites Copa</h2>

<div class="players">
<img src="https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg">
<img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Lionel_Messi.jpg">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Neymar_2018.jpg">
</div>

<div id="jogosAluno"></div>

</div>

<div class="card">

<h2>Ranking</h2>

<table>
<thead>
<tr>
<th>#</th>
<th>Aluno</th>
<th>Turma</th>
<th>Pontos</th>
</tr>
</thead>

<tbody id="ranking"></tbody>

</table>

</div>

</div>

<div id="profPanel" class="hidden">

<div class="card">

<h2>Painel Professor</h2>

<button onclick="calcular()">Calcular Pontos</button>
<button onclick="resetar()">Resetar Campeonato</button>

</div>

<div class="card">

<h3>Inserir Resultados</h3>

<div id="jogosProf"></div>

</div>

<div class="card">

<h3>Ranking por Turma</h3>

<div id="rankingTurma"></div>

</div>

</div>

</div>

<script>

const times=[
"Brasil","Argentina","França","Portugal",
"Espanha","Alemanha","Inglaterra","Itália",
"Uruguai","Holanda","Croácia","México",
"EUA","Japão","Coreia","Marrocos"
]

let jogos=[]

for(let i=0;i<times.length;i++){
for(let j=i+1;j<times.length;j++){

jogos.push({
t1:times[i],
t2:times[j],
resultado:null
})

if(jogos.length==64) break
}

if(jogos.length==64) break
}

let usuario=""
let turma=""

function login(){

let email=document.getElementById("email").value

if(!email.endsWith("@edu.mt.gov.br")){
document.getElementById("erro").innerText="Use email institucional"
return
}

usuario=document.getElementById("nome").value
turma=document.getElementById("turma").value

let tipo=document.getElementById("tipoLogin").value

document.getElementById("login").style.display="none"

if(tipo=="aluno"){

document.getElementById("alunoPanel").classList.remove("hidden")

criarJogosAluno()

mostrarRanking()

}

if(tipo=="professor"){

document.getElementById("profPanel").classList.remove("hidden")

criarJogosProf()

}

}

function criarJogosAluno(){

let area=document.getElementById("jogosAluno")

area.innerHTML=""

jogos.forEach((j,i)=>{

let odds=(Math.random()*2+1).toFixed(2)

let div=document.createElement("div")

div.className="game"

div.innerHTML=`

${j.t1} vs ${j.t2} | odds ${odds}<br>

<input class="g1" type="number">
<input class="g2" type="number">

<button onclick="palpite(${i},this)">Salvar</button>

`

area.appendChild(div)

})

}

function palpite(i,btn){

let card=btn.parentElement

let g1=card.querySelector(".g1").value
let g2=card.querySelector(".g2").value

let p=JSON.parse(localStorage.getItem("palpites")||"[]")

p.push({usuario,turma,jogo:i,g1,g2})

localStorage.setItem("palpites",JSON.stringify(p))

btn.innerText="Palpite salvo"

}

function criarJogosProf(){

let area=document.getElementById("jogosProf")

area.innerHTML=""

jogos.forEach((j,i)=>{

let div=document.createElement("div")

div.className="game"

div.innerHTML=`

${j.t1} vs ${j.t2}<br>

<input class="r1" type="number">
<input class="r2" type="number">

<button onclick="resultado(${i},this)">Salvar</button>

`

area.appendChild(div)

})

}

function resultado(i,btn){

let card=btn.parentElement

let r1=card.querySelector(".r1").value
let r2=card.querySelector(".r2").value

jogos[i].resultado={r1,r2}

btn.innerText="Resultado salvo"

}

function calcular(){

let palpites=JSON.parse(localStorage.getItem("palpites")||"[]")

let ranking={}

palpites.forEach(p=>{

let jogo=jogos[p.jogo]

if(!jogo.resultado) return

let r1=jogo.resultado.r1
let r2=jogo.resultado.r2

let pontos=0

if(p.g1==r1 && p.g2==r2) pontos=30
else if((p.g1-p.g2)*(r1-r2)>0) pontos=10

if(!ranking[p.usuario]) ranking[p.usuario]={turma:p.turma,pontos:0}

ranking[p.usuario].pontos+=pontos

})

let lista=[]

for(let nome in ranking){

lista.push({
nome,
turma:ranking[nome].turma,
pontos:ranking[nome].pontos
})

}

localStorage.setItem("ranking",JSON.stringify(lista))

mostrarRanking()

mostrarTurma()

alert("Pontuação calculada")

}

function mostrarRanking(){

let r=JSON.parse(localStorage.getItem("ranking")||"[]")

let tb=document.getElementById("ranking")

if(!tb) return

tb.innerHTML=""

r.sort((a,b)=>b.pontos-a.pontos)

r.forEach((a,i)=>{

tb.innerHTML+=`<tr>
<td>${i+1}</td>
<td>${a.nome}</td>
<td>${a.turma}</td>
<td>${a.pontos}</td>
</tr>`

})

}

function mostrarTurma(){

let r=JSON.parse(localStorage.getItem("ranking")||"[]")

let turmas={}

r.forEach(a=>{

if(!turmas[a.turma]) turmas[a.turma]=0

turmas[a.turma]+=a.pontos

})

let div=document.getElementById("rankingTurma")

div.innerHTML=""

for(let t in turmas){

div.innerHTML+=`${t} : ${turmas[t]} pontos<br>`

}

}

function resetar(){

localStorage.clear()

alert("Campeonato resetado")

location.reload()

}

</script>

</body>
</html>
