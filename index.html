<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>macaw.bet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
margin:0;
background:#0b3d91;
color:white;
}

header{
background:#082a63;
padding:15px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:#114fb3;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

input,select{
padding:10px;
border:none;
border-radius:6px;
margin:5px;
}

button{
padding:10px 18px;
background:#ffd700;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

.hidden{
display:none;
}

.game{
background:#1565d8;
padding:15px;
border-radius:10px;
margin-top:10px;
}

.flags img{
width:30px;
margin:0 5px;
}

.players img{
width:70px;
border-radius:50%;
margin:6px;
border:3px solid white;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:8px;
background:#1e6be0;
text-align:center;
}

</style>
</head>

<body>

<header>🦜 macaw.bet</header>

<div class="container">

<!-- LOGIN -->

<div id="login" class="card">

<h2>Login</h2>

<select id="tipoLogin">
<option value="aluno">Aluno</option>
<option value="professor">Professor</option>
</select><br>

<input id="nome" placeholder="Nome"><br>
<input id="turma" placeholder="Turma"><br>
<input id="email" placeholder="Email"><br>
<input type="password" id="senha" placeholder="Senha"><br>

<button onclick="login()">Entrar</button>

<p id="msg"></p>

</div>

<!-- PAINEL ALUNO -->

<div id="alunoPanel" class="hidden">

<div class="card">

<h2>Palpites da Copa</h2>

<div class="players">
<img src="https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg">
<img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Lionel_Messi.jpg">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Neymar_2018.jpg">
</div>

</div>

<div id="jogos"></div>

<div class="card">

<h3>Ranking</h3>

<table>

<thead>
<tr>
<th>#</th>
<th>Aluno</th>
<th>Turma</th>
<th>Pontos</th>
</tr>
</thead>

<tbody id="ranking"></tbody>

</table>

</div>

</div>

<!-- PAINEL PROFESSOR -->

<div id="profPanel" class="hidden">

<div class="card">

<h2>Painel do Professor</h2>

<button onclick="mostrarRanking()">Atualizar ranking</button>
<button onclick="resetar()">Resetar pontuação</button>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>#</th>
<th>Aluno</th>
<th>Turma</th>
<th>Pontos</th>
</tr>
</thead>

<tbody id="rankingProf"></tbody>

</table>

</div>

</div>

</div>

<script>

const times=[
"Brasil","Argentina","França","Portugal",
"Espanha","Alemanha","Inglaterra","Itália",
"Uruguai","Holanda","Croácia","México",
"EUA","Japão","Coreia","Marrocos"
]

let jogos=[]

for(let i=0;i<times.length;i++){
for(let j=i+1;j<times.length;j++){

jogos.push([times[i],times[j]])

if(jogos.length==64) break

}

if(jogos.length==64) break

}

let usuario=null
let turma=null

function login(){

usuario=document.getElementById("nome").value
turma=document.getElementById("turma").value

let tipo=document.getElementById("tipoLogin").value

if(usuario==""){
document.getElementById("msg").innerText="Digite seu nome"
return
}

document.getElementById("login").style.display="none"

if(tipo=="aluno"){

document.getElementById("alunoPanel").classList.remove("hidden")

criarJogos()

}

if(tipo=="professor"){

document.getElementById("profPanel").classList.remove("hidden")

mostrarRanking()

}

if(!localStorage.getItem("ranking")){
localStorage.setItem("ranking",JSON.stringify([]))
}

}

function criarJogos(){

let area=document.getElementById("jogos")

area.innerHTML=""

jogos.forEach(j=>{

let div=document.createElement("div")

div.className="game"

div.innerHTML=`

<h3>${j[0]} vs ${j[1]}</h3>

<input class="g1" type="number" placeholder="Gols ${j[0]}">

<input class="g2" type="number" placeholder="Gols ${j[1]}">

<button onclick="apostar(this)">Apostar</button>

<p class="res"></p>

`

area.appendChild(div)

})

}

function apostar(btn){

let card=btn.parentElement

let g1=card.querySelector(".g1").value
let g2=card.querySelector(".g2").value

if(g1==""||g2==""){

card.querySelector(".res").innerText="Digite placar"

return

}

let pontos=10

if(g1==g2) pontos=20

if(Math.random()>0.85) pontos=40

card.querySelector(".res").innerText="+"+pontos+" pontos"

salvar(pontos)

}

function salvar(p){

let r=JSON.parse(localStorage.getItem("ranking"))

let aluno=r.find(a=>a.nome===usuario)

if(aluno){

aluno.pontos+=p

}else{

r.push({nome:usuario,turma:turma,pontos:p})

}

localStorage.setItem("ranking",JSON.stringify(r))

mostrarRanking()

}

function mostrarRanking(){

let r=JSON.parse(localStorage.getItem("ranking"))

r.sort((a,b)=>b.pontos-a.pontos)

let tb=document.getElementById("ranking")
let tb2=document.getElementById("rankingProf")

if(tb) tb.innerHTML=""
if(tb2) tb2.innerHTML=""

r.forEach((a,i)=>{

let row=`<tr>

<td>${i+1}</td>

<td>${a.nome}</td>

<td>${a.turma}</td>

<td>${a.pontos}</td>

</tr>`

if(tb) tb.innerHTML+=row
if(tb2) tb2.innerHTML+=row

})

}

function resetar(){

localStorage.setItem("ranking",JSON.stringify([]))

mostrarRanking()

}

</script>

</body>
</html>
